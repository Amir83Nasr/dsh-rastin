name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Extract notes from CHANGELOG.md
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          hdr="## [$version]"
          awk -v hdr="$hdr" '
            index($0, hdr) == 1 && (length($0) == length(hdr) || substr($0, length(hdr) + 1, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "notes-file=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.notes-file }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # prepack rebuilds client.js from src/ + fonts/, so the tarball matches the tag.
      # Auth: npm trusted publishing (OIDC, `id-token: write` above) — one-time
      # setup on npmjs.com: Package → Settings → Trusted Publisher → GitHub Actions,
      # repo `Amir83Nasr/dsh-rastin`, workflow `release.yml`. Falls back to an
      # `NPM_TOKEN` secret when one is set.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
