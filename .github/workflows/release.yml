name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url` here on purpose: setup-node would write an empty
      # `_authToken` line to .npmrc, which makes npm skip OIDC auth.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Extract notes from CHANGELOG.md
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          hdr="## [$version]"
          awk -v hdr="$hdr" '
            index($0, hdr) == 1 && (length($0) == length(hdr) || substr($0, length(hdr) + 1, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "notes-file=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      # prepack rebuilds client.js from src/ + fonts/, so the tarball matches the tag.
      # Auth: npm trusted publishing (OIDC via `id-token: write`), no token needed;
      # provenance is automatic for a public repo + public package. One-time setup:
      # npmjs.com → package Settings → Trusted Publisher → GitHub Actions, with
      # repo `Amir83Nasr/dsh-rastin` and workflow `release.yml`. Token alternative:
      # set the NPM_TOKEN secret and uncomment the env line below.
      - name: Publish to npm
        id: publish
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@amir83nasr/dsh-rastin@$v" version >/dev/null 2>&1; then
            echo "@amir83nasr/dsh-rastin@$v already on npm — skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            npm publish --provenance --access public
          fi
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.notes-file }}" --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
